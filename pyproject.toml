[project]
name = "erosion"
version = "0.1.0"
description = "CHART FEAT erosion module — lifecycle orchestrator + CSHORE cross-shore morphology"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "matplotlib",
    "pydantic>=2.0",
    "pytest",
    "dask[distributed]>=2026.6.0",
    "bokeh>=3.1.0",
]

[project.scripts]
run-pipeline = "erosion.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erosion"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I), pyupgrade (UP)
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E741",  # ambiguous single-letter names (e.g. l) — used in short math expressions
]
