[project]
name = "beachfx-cshore"
version = "0.1.0"
description = "Setup and run CSHORE for Beach-fx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "h5py",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "matplotlib",
    "pydantic>=2.0",
    "pytest",
    "dask[distributed]>=2026.6.0",
    "bokeh>=3.1.0",
]

[project.scripts]
run-cshore = "examples.run_cshore:main"

[tool.uv]
package = false
